<!doctype html>
<!--
  ILLUSTRATIVE shell — shows the shape vcsr targets: an empty <body> that the
  WASM fills client-side. It is NOT served or runnable here: counter is
  dialect SOURCE (no prebuilt browser wasm), so there's no app.js/core.wasm to
  load. For a real, served, browser-running app see testdata/dashboard-app
  (built with `vcsr build`, served by `vcsr serve`, screenshotted by
  tools/browser-smoke). `vcsr build` would emit a version of this with hashed
  asset names (app.[hash].js, app.[hash].css) once V can compile these
  components to browser wasm.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vcsr · counter</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="preload" href="/core.wasm" as="fetch" crossorigin />
    <script type="module" src="/app.js"></script>
  </head>
  <body><!-- the WASM builds the UI here --></body>
</html>
