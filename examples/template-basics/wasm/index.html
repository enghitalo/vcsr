<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>vcsr — template basics</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f4f5f7; color: #1d2330; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #0001; padding: 1.5rem 1.75rem; width: 22rem; display: grid; gap: .75rem; }
    h1 { margin: 0; font-size: 1.6rem; }
    label { display: grid; gap: .25rem; font-size: .85rem; color: #5b6475; }
    input { font: inherit; padding: .45rem .6rem; border: 1px solid #c9ced8; border-radius: 6px; }
    p { margin: 0; }
    .stats b { color: #3451b2; }
    .shouts { color: #5b6475; }
    .actions { display: flex; gap: .5rem; }
    button { font: inherit; padding: .4rem .9rem; border-radius: 6px; border: 1px solid #c9ced8; background: #fff; cursor: pointer; }
    button:first-child { background: #3451b2; border-color: #3451b2; color: #fff; }
    footer { font-size: .8rem; color: #8a92a3; border-top: 1px solid #eceef2; padding-top: .6rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
